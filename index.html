<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand display font (Qrokinex) — preloaded so it's ready before first
         use (e.g. the /test3 loading screen), instead of popping in late. -->
    <link rel="preload" href="/font/Qrokinex.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Every customer page is cream; paint the page cream from the very
         first frame (the default dark body otherwise flashes before the app
         mounts). Not on /admin (dark panel); App.jsx removes it if you move
         into the admin. -->
    <script>
      if (location.pathname.indexOf('/admin') !== 0) {
        document.documentElement.style.background = '#FFF8E7';
        var t3s = document.createElement('style');
        t3s.id = 't3-boot-bg'; // removed by BootBgCleanup (App.jsx) on /admin
        t3s.textContent = 'body{background:#FFF8E7!important}';
        document.head.appendChild(t3s);
      }
    </script>
    <title>ZUNUZ — Everyday Fashion Jewellery</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loaded non-render-blocking: media="print" makes the browser fetch it
    without waiting to apply/parse it before first paint, then onload flips it
    to "all" once it's actually ready. noscript keeps it working with JS off. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600;1,700&family=Syncopate:wght@700&family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Momo+Signature&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600;1,700&family=Syncopate:wght@700&family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Momo+Signature&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600;1,700&family=Syncopate:wght@700&family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Momo+Signature&display=swap" rel="stylesheet"></noscript>
    <!-- Google Identity Services (Sign in with Google) is loaded only where a
         sign-in button shows — see src/components/GoogleSignInButton.jsx. -->
    <!-- Home page: start fetching the first hero photo right away (it's a CSS
         background, so the browser would otherwise only find it after the
         app's JavaScript has run). Phone art in portrait, desktop art otherwise. -->
    <script>
      if (location.pathname === '/') {
        [['/poster1_mob.webp', '(orientation: portrait)'], ['/poster1_desk.webp', '(orientation: landscape)']].forEach(function (h) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = h[0]; l.media = h[1]; l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      }
    </script>
    <!-- Google Tag Manager — not loaded on /test pages, the admin panel (GTM
         scripts could read the admin's session) or pages whose URL carries a
         one-time token (reset / verify links must never reach analytics). -->
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        var isTestPage = path.includes('/test') || /^\/(admin|reset-password|verify-email|unsubscribe)(\/|$)/.test(path);
        if (isTestPage) {
          window['ga-disable-GTM-M4RLS7RP'] = true;
          console.log('[Analytics] Tracking disabled for test page:', window.location.pathname);
        } else {
          // Loaded once the page has finished loading (+2s idle), or on the
          // first tap / scroll / key — whichever comes first — so the ~135 KB
          // of tag scripts don't compete with the first screen. Pageviews are
          // still recorded (dataLayer keeps the original start time).
          var gtmStart = new Date().getTime();
          var loadGtm = function () {
            if (window.__gtmLoaded) return;
            window.__gtmLoaded = true;
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            gtmStart,event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer','GTM-M4RLS7RP');
          };
          ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (ev) {
            window.addEventListener(ev, loadGtm, { once: true, passive: true });
          });
          var afterLoad = function () { setTimeout(loadGtm, 2000); };
          if (document.readyState === 'complete') afterLoad();
          else window.addEventListener('load', afterLoad, { once: true });
        }
      })();
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body class="bg-[#1F2024] text-[#F5F2EB]">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M4RLS7RP"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <!-- Home page, first visit in this tab: a plain-HTML copy of the loading
         screen (cream, "ZUNUZ", progress bar) with the hero photo under it,
         shown the moment the HTML arrives — before the app's JavaScript and
         its settings/content requests are done. The app's own loader takes
         over underneath and then removes this (removeBootLoader in
         src/components/landing/useHeroIntro.js). Looks the same as before;
         the page just shows something ~3s sooner on a slow phone. -->
    <script>
      (function () {
        var seen = false;
        try { seen = !!sessionStorage.getItem('zunuz_intro_seen'); } catch (e) { seen = true; }
        if (location.pathname !== '/' || seen) return;
        var boot = document.createElement('div');
        boot.id = 'boot-ld';
        boot.setAttribute('aria-hidden', 'true');
        boot.innerHTML =
          '<picture><source media="(orientation: portrait)" srcset="/poster1_mob.webp">' +
          '<img src="/poster1_desk.webp" alt="" fetchpriority="high" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></picture>' +
          '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF8E7;color:#111110">' +
            '<div class="boot-word" style="font-family:Qrokinex,sans-serif;font-size:clamp(36px,6vw,88px);line-height:1.05;opacity:0;transition:opacity .4s">' +
              'ZUNUZ'.split('').map(function (c) { return '<span style="display:inline-block;padding:.1em .02em">' + c + '</span>'; }).join('') +
            '</div>' +
            '<div style="margin-top:clamp(20px,3vw,36px);height:3px;width:min(280px,60vw);overflow:hidden;border-radius:9999px;background:rgba(17,17,16,.1)">' +
              '<div style="height:100%;width:100%;border-radius:9999px;background:#FF3D8B;transform-origin:left;transform:scaleX(.08)"></div></div>' +
            '<p style="margin:12px 0 0;font:600 12px Inter,sans-serif;letter-spacing:.2em;color:rgba(17,17,16,.6)">0%</p>' +
          '</div>';
        boot.style.cssText = 'position:fixed;inset:0;z-index:9999;overflow:hidden;background:#FFF8E7;transition:opacity .35s';
        document.body.insertBefore(boot, document.getElementById('root'));
        // Letters appear once the brand font is ready (never in a fallback font).
        var word = boot.querySelector('.boot-word');
        var show = function () { word.style.opacity = '1'; };
        if (document.fonts && document.fonts.load) document.fonts.load('400 100px Qrokinex').then(show, show);
        else show();
        // Never left on screen if the app fails to start.
        setTimeout(function () { if (boot.parentNode) boot.remove(); }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
